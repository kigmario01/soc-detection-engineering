<!--
  =============================================================================
  Wazuh Manager / Agent Configuration Template (ossec.conf)
  Autor: Mario de Jesús Álvarez Ramos
  Componentes: Active Response, FIM (Syscheck), Vulnerability Detector, NIDS Integration
  =============================================================================
-->

<ossec_config>

  <!-- ==================== RESPUESTA ACTIVA (ACTIVE RESPONSE) ==================== -->
  <!-- Bloqueo automático mediante iptables en el kernel ante ataques confirmados -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- 1. Bloqueo automático de IP ante ataque de Fuerza Bruta (Regla 5712 / 100010) -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5712,100010</rules_id>
    <timeout>600</timeout> <!-- Bloqueo temporal por 10 minutos -->
  </active-response>

  <!-- 2. Bloqueo inmediato ante intento de Inyección Web crítica (Nivel 12+) -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100020,100040</rules_id>
    <timeout>1800</timeout> <!-- Bloqueo de 30 minutos para atacantes web o Nmap agressivo -->
  </active-response>


  <!-- ==================== MONITOREO DE INTEGRIDAD (FIM / SYSCHECK) ==================== -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency> <!-- Chequeo periódico cada 5 minutos -->
    <scan_on_start>yes</scan_on_start>

    <!-- Monitorización en tiempo real con cálculo de hashes SHA256 y atributos -->
    <directories realtime="yes" check_all="yes">/etc,/usr/bin,/usr/sbin</directories>
    <directories realtime="yes" check_all="yes">/home/mario/documentos-sensibles</directories>

    <!-- Prevención de falsos positivos en directorios de runtime dinámico -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>

    <!-- Monitoreo de creación y eliminación de archivos -->
    <whodata>yes</whodata> <!-- Registra qué usuario y proceso ejecutó la modificación (Linux auditd) -->
  </syscheck>


  <!-- ==================== INGESTA DE LOGS & INTEGRACIÓN CON SURICATA NIDS ==================== -->
  <!-- Lectura del flujo estructurado JSON (EVE) emitido por Suricata -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <!-- Monitoreo de logs de Reverse Proxy (Nginx) -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>

  <!-- Monitoreo de autenticación del sistema Linux (Syslog / Auth) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>


  <!-- ==================== DETECCIÓN DE VULNERABILIDADES (CVE AUDITING) ==================== -->
  <vulnerability-detector>
    <enabled>yes</enabled>
    <interval>5m</interval>
    <min_full_scan_interval>6h</min_full_scan_interval>
    <run_on_start>yes</run_on_start>

    <provider name="canonical">
      <enabled>yes</enabled>
      <os>noble,jammy</os>
      <update_interval>1h</update_interval>
    </provider>

    <provider name="nvd">
      <enabled>yes</enabled>
      <update_interval>1h</update_interval>
    </provider>
  </vulnerability-detector>

</ossec_config>
